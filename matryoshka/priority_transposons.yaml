schema_version: "1.0"
roadmap_version: "2026-08-27"
scope: >-
  Priority named elements repeatedly used as worked examples or major comparison
  cases in the supplied expert material. A target is validated only when an
  arbitrary locus can be assembled from independently detected components;
  whole-element similarity is secondary naming evidence.

status_levels:
  validated_component_rule: Component detection, grammar, variation and negative controls are tested.
  implemented_needs_validation: A component/signature rule exists but its boundaries or variation panel are incomplete.
  reference_supported: Whole-reference or curated feature-map support exists, without a complete general component grammar.
  definition_required: The element is in scope but still needs a reviewable component definition and validation panel.

acceptance_contract:
  required_cases:
    - canonical positive control
    - component-only run with complete-element lookup disabled
    - reverse-orientation locus
    - close variant with substitutions
    - internal insertion or deletion where biologically permitted
    - partial or interrupted locus that retains components without a complete name
    - long arbitrary contig containing the locus and realistic flanks
    - related-family negative control
  required_outputs:
    - annotation.json
    - annotation.gff3
    - annotation.gbk
    - annotation.cell
    - hierarchy SVG
    - locus map SVG
    - locus table SVG
    - component and classification evidence ledger

milestones:
  A:
    objective: Finish and broaden the supplied component definitions.
    targets: [Tn1, Tn2, Tn3, Tn21, Tn1721, Tn1722, Tn402, Tn4401, Tn5393, Tn5403]
  B:
    objective: Replace broad signatures and reference-only calls with bounded component grammars.
    targets: [Tn7, Tn10, Tn1696, Tn1331, Tn1999, Tn6029]
  C:
    objective: Validate nested/hybrid assembly on a complex worked locus.
    targets: [Tn2670]

