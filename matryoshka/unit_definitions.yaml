schema_version: "1.0"
definition_version: "2026-08-27"
name: Reviewed unit-transposon definitions
purpose: >-
  Human-reviewable component rules and feature maps for unit transposons outside
  the initial Tn1/Tn2/Tn3 group. Component grammar creates family-like calls;
  whole-element comparison is secondary evidence that can confirm an exact
  reviewed definition.

sources:
  - id: expert_worked_examples
    file: OtherTn__examples.docx
    scope: supplied component sequences, structural descriptions and worked maps
  - id: tn21_annotation
    citation: Liebert, Hall and Summers 1999, Transposon Tn21 flagship of the floating genome
    accession: AF071413
    scope: Tn21 boundaries, transposition region, In2 and mer-region annotation
  - id: tn1721_reference
    accession: AB366441
    scope: reviewed Tn1721 and Tn1722 intervals and coding features

component_detection:
  long:
    minimum_reference_length: 200
    minimum_identity_percent: 90.0
    minimum_hsp_length: 100
    minimum_assembled_coverage_percent: 70.0
    maximum_reference_gap_bp: 500
  short:
    minimum_identity_percent: 85.0
    minimum_hsp_length: 80
    minimum_subject_coverage_percent: 70.0
    minimum_assembled_coverage_percent: 85.0
  terminal_ir:
    minimum_identity_percent: 89.0
    minimum_hsp_length: 34
    minimum_subject_coverage_percent: 89.0
    minimum_assembled_coverage_percent: 85.0
    evalue: 10.0
  junction:
    minimum_identity_percent: 95.0
    minimum_hsp_length: 200
    minimum_subject_coverage_percent: 70.0
    minimum_assembled_coverage_percent: 80.0

classification:
  complete_label_template: "{family}-like"
  minimum_component_profile_score_percent: 85.0
  exact_reference_rule: >-
    A family-like call is made from complete component grammar. The reviewed
    family name without “-like” is used only when the assembled locus is an
    exact, complete match to the declared whole-element definition.
  fragment_rule: >-
    Detected components remain visible when the grammar is incomplete, but an
    incomplete component set is not promoted to a complete family-like call.

units:
  Tn21:
    display_name: Tn21
    canonical_reference:
      file: tn21.fasta
      record: Tn21
      accession: AF071413
      length: 19672
    terminal_ir_length: 38
    tsd_length: 5
    candidate_span_bp: {minimum: 15000, maximum: 35000}
    anchor_role: tnpA
    required_order: [terminal_IR, tnpA, tnpR, res, tnpM, terminal_IR]
    required_counts: {terminal_IR: 2, tnpA: 1, tnpR: 1, res: 1, tnpM: 1}
    terminal_names_forward: [IRR, IRL]
    optional_components: [integron_5cs, cassette_region, integron_3cs, tni, mer_region]
    expert_rule: >-
      Call a complete Tn21-like unit when two Tn21 terminal IRs delimit a
      Tn21-specific tnpA-tnpR-res-tnpM transposition region in the declared
      order. The class 1 integron, partial or complete tni region, internal
      insertion sequences and mer module are described when present but are
      not required to discover the Tn21-subgroup backbone. Exact Tn21 requires
      secondary confirmation against AF071413.
    components:
      - {role: terminal_IR, name: IRR, element_type: IR, start: 1, end: 38, strand: ".", category: terminal_ir}
      - {role: tnpA, name: tnpA, element_type: transposition_gene, start: 34, end: 3000, strand: "-", category: long}
      - {role: tnpR, name: tnpR, element_type: transposition_gene, start: 3003, end: 3563, strand: "-", category: long}
      - {role: res, name: res, element_type: res_site, start: 3576, end: 3704, strand: ".", category: short}
      - {role: tnpM, name: tnpM, element_type: transposition_gene, start: 3689, end: 4039, strand: "-", category: long}
      - {role: integron_5cs, name: 5'-CS, element_type: integron_segment, start: 4040, end: 5394, strand: "+", category: long, optional: true}
      - {role: cassette_region, name: aadA1 cassette region, element_type: cassette, start: 5395, end: 6250, strand: "+", category: long, optional: true}
      - {role: integron_3cs, name: 3'-CS, element_type: integron_segment, start: 6251, end: 8275, strand: "+", category: long, optional: true}
      - {role: tni, name: tni, element_type: transposon_component, start: 12358, end: 15039, strand: "-", category: long, optional: true, fragment: true}
      - {role: mer_region, name: mer, element_type: transposon_component, start: 15040, end: 19672, strand: "-", category: long, optional: true}
      - {role: terminal_IR, name: IRL, element_type: IR, start: 19635, end: 19672, strand: ".", category: terminal_ir}

  Tn1722:
    display_name: Tn1722
    canonical_reference:
      file: reviewed_units.fasta
      record: Tn1722_AB366441
      accession: AB366441
      length: 5640
    terminal_ir_length: 38
    tsd_length: 5
    candidate_span_bp: {minimum: 5000, maximum: 8500}
    anchor_role: tnpA
    required_order: [terminal_IR, mcp, tnpR, tnpA, terminal_IR]
    required_counts: {terminal_IR: 2, mcp: 1, tnpR: 1, tnpA: 1}
    terminal_names_forward: [IRL, IRR]
    optional_components: []
    expert_rule: >-
      Call a complete Tn1722-like unit when two Tn1721-family terminal IRs
      delimit the mcp-tnpR-tnpA backbone in the declared order. Exact Tn1722
      requires secondary whole-element confirmation against the 5640 bp
      reviewed interval from AB366441.
    components:
      - {role: terminal_IR, name: IRL, element_type: IR, start: 1, end: 38, strand: ".", category: terminal_ir}
      - {role: mcp, name: mcp, element_type: gene, start: 190, end: 1767, strand: "-", category: long}
      - {role: tnpR, name: tnpR, element_type: transposition_gene, start: 2077, end: 2637, strand: "+", category: long}
      - {role: tnpA, name: tnpA, element_type: transposition_gene, start: 2641, end: 5607, strand: "+", category: long}
      - {role: terminal_IR, name: IRR, element_type: IR, start: 5603, end: 5640, strand: ".", category: terminal_ir}

  Tn1721:
    display_name: Tn1721
    canonical_reference:
      file: reviewed_units.fasta
      record: Tn1721_AB366441
      accession: AB366441
      length: 11128
    terminal_ir_length: 38
    tsd_length: 5
    candidate_span_bp: {minimum: 10000, maximum: 16000}
    anchor_role: tnpA
    required_order: [terminal_IR, mcp, tnpR, tnpA, terminal_IR, tetR, tetA, pecM, tet_tnp_junction, terminal_IR]
    required_counts: {terminal_IR: 3, mcp: 1, tnpR: 1, tnpA: 1, tetR: 1, tetA: 1, pecM: 1, tet_tnp_junction: 1}
    terminal_names_forward: [IRL, internal IRR, IRR]
    optional_components: []
    expert_rule: >-
      Tn1721 consists of the complete Tn1722-like backbone followed by an
      internal copy of IRR, the tetR-tetA-pecM region and a partial duplication
      of the tnp region ending at the terminal IRR. Require all three IR
      occurrences and the unique tet-to-duplicated-tnp junction; tet genes or
      a Tn1722-like backbone alone are insufficient. Exact Tn1721 requires
      secondary whole-element confirmation against the 11128 bp reviewed
      interval from AB366441.
    components:
      - {role: terminal_IR, name: IRL, element_type: IR, start: 1, end: 38, strand: ".", category: terminal_ir}
      - {role: mcp, name: mcp, element_type: gene, start: 190, end: 1767, strand: "-", category: long}
      - {role: tnpR, name: tnpR, element_type: transposition_gene, start: 2077, end: 2637, strand: "+", category: long}
      - {role: tnpA, name: tnpA, element_type: transposition_gene, start: 2641, end: 5607, strand: "+", category: long}
      - {role: terminal_IR, name: internal IRR, element_type: IR, start: 5603, end: 5640, strand: ".", category: terminal_ir}
      - {role: tetR, name: tetR, element_type: gene, start: 5939, end: 6589, strand: "-", category: long}
      - {role: tetA, name: tet(A), element_type: AMR, start: 6695, end: 7894, strand: "+", category: long}
      - {role: pecM, name: pecM, element_type: gene, start: 7926, end: 8810, strand: "-", category: long}
      - {role: tet_tnp_junction, name: tet-to-tnp duplication junction, element_type: transposon_component, start: 9140, end: 9540, strand: "+", category: junction}
      - {role: terminal_IR, name: IRR, element_type: IR, start: 11091, end: 11128, strand: ".", category: terminal_ir}

feature_maps:
  Tn21:
    - {name: IRR, element_type: IR, family: Tn21, role: terminal_IR, start: 1, end: 38, fid: LOCUS-REF-Tn21-IRR}
    - {name: tnp, element_type: transposon_component, family: Tn21, role: tnp_region, start: 1, end: 4039, fid: LOCUS-REF-Tn21-tnp}
    - {name: IRi, element_type: IR, family: Tn402, role: integron_IRi, start: 4040, end: 4064, fid: LOCUS-REF-IRi}
    - {name: 5'-CS, element_type: integron_segment, family: class1_integron, role: integron_5cs, start: 4040, end: 5394, fid: LOCUS-REF-5CS-GGG, note: AF071413 three-G variant}
    - {name: aadA1 cassette region, element_type: cassette, family: class1_integron, role: cassette_region, start: 5395, end: 6250, fid: LOCUS-REF-In2-aadA1, note: curated cassette region between supplied 5'-CS and 3'-CS}
    - {name: 3'-CS, element_type: integron_segment, family: class1_integron, role: integron_3cs, start: 6251, end: 8275, fid: LOCUS-REF-3CS, note: 2025 bp present of 2239 bp reference, fragment: true}
    - {name: tni, element_type: transposon_component, family: Tn402, role: tni, start: 12358, end: 15039, strand: "-", fid: LOCUS-REF-Tn402-tni, note: 2682 bp terminal fragment of the 4733 bp supplied tni region, fragment: true}
    - {name: IRt, element_type: IR, family: Tn402, role: integron_IRt, start: 15015, end: 15039, strand: "-", fid: LOCUS-REF-IRt}
    - {name: mer, element_type: transposon_component, family: Tn21, role: mer_region, start: 15040, end: 19672, fid: LOCUS-REF-Tn21-mer}
    - {name: IRL, element_type: IR, family: Tn21, role: terminal_IR, start: 19635, end: 19672, fid: LOCUS-REF-Tn21-IRL}
  Tn1721_AB366441:
    - {name: IRL, element_type: IR, family: Tn1721, role: terminal_IR, start: 1, end: 38, fid: LOCUS-REF-Tn1721-IRL}
    - {name: Tn1722-like backbone, element_type: transposon_component, family: Tn1721, role: tn1722_backbone, start: 1, end: 5640, fid: LOCUS-REF-Tn1722-backbone}
    - {name: IRR, element_type: IR, family: Tn1721, role: terminal_IR, start: 5603, end: 5640, strand: "-", fid: LOCUS-REF-Tn1721-IRR-internal, note: internal IRR copy at the partial duplication boundary}
    - {name: tet(A)-tnp duplicated region, element_type: transposon_component, family: Tn1721, role: tet_tnp_region, start: 5641, end: 11128, fid: LOCUS-REF-Tn1721-tet}
    - {name: IRR, element_type: IR, family: Tn1721, role: terminal_IR, start: 11091, end: 11128, strand: "-", fid: LOCUS-REF-Tn1721-IRR-terminal}
  Tn1722_AB366441:
    - {name: IRL, element_type: IR, family: Tn1722, role: terminal_IR, start: 1, end: 38, fid: LOCUS-REF-Tn1721-IRL}
    - {name: IRR, element_type: IR, family: Tn1722, role: terminal_IR, start: 5603, end: 5640, strand: "-", fid: LOCUS-REF-Tn1721-IRR}
  Tn4401_GU595196:
    - {name: IRL, element_type: IR, family: Tn4401, start: 1, end: 40, fid: LOCUS-REF-Tn4401-IRL}
    - {name: tnp, element_type: transposon_component, family: Tn4401, start: 1, end: 4927, fid: LOCUS-REF-Tn4401-tnp}
    - {name: ISKpn7, element_type: IS, family: IS21, start: 4928, end: 6883, strand: "+", fid: LOCUS-REF-ISKpn7, note: 99.387% to supplied GU595196 reference}
    - {name: blaKPC region, element_type: transposon_component, family: Tn4401, start: 6884, end: 8062, fid: LOCUS-REF-Tn4401-KPC-region}
    - {name: ISKpn6, element_type: IS, family: IS1182, start: 8066, end: 9605, strand: "-", fid: LOCUS-REF-ISKpn6}
    - {name: right end, element_type: transposon_component, family: Tn4401, start: 9608, end: 9907, fid: LOCUS-REF-Tn4401-right-end}
    - {name: IRR, element_type: IR, family: Tn4401, start: 9868, end: 9907, strand: "-", fid: LOCUS-REF-Tn4401-IRR}
  Tn5393_AF262622:
    - {name: IRL, element_type: IR, family: Tn5393, start: 1, end: 38, fid: LOCUS-REF-Tn5393-IRL}
    - {name: IRR, element_type: IR, family: Tn5393, start: 5433, end: 5470, strand: "-", fid: LOCUS-REF-Tn5393-IRR}
  Tn5403_X75779:
    - {name: IRL, element_type: IR, family: Tn5403, start: 1, end: 38, fid: LOCUS-REF-Tn5403-IR}
    - {name: IRR, element_type: IR, family: Tn5403, start: 3626, end: 3663, strand: "-", fid: LOCUS-REF-Tn5403-IR}
